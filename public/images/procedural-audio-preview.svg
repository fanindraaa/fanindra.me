<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#F5F5F5" rx="3"/>
  <rect width="800" height="480" fill="none" stroke="#E5E5E5" stroke-width="1" rx="3"/>
  <g transform="translate(60, 60)">
    <text x="0" y="0" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="15" fill="#737373">Web Audio API · Real-time Synthesis</text>
    <text x="0" y="32" font-family="Newsreader, Georgia, serif" font-size="22" fill="#10141e" font-weight="500">Tactile Audio Impulse Response</text>
    <text x="0" y="58" font-family="Newsreader, Georgia, serif" font-size="15" fill="#737373">Zero-latency exponential decay curves designed for interactive feedback</text>

    <rect x="0" y="90" width="680" height="250" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <!-- Center baseline -->
    <line x1="40" y1="215" x2="640" y2="215" stroke="#E5E5E5" stroke-width="1"/>
    <!-- Waveform decaying -->
    <path d="M 60 215 Q 80 130, 95 215 T 120 215 T 145 215 T 170 215 T 200 215 T 240 215 T 290 215 L 620 215" fill="none" stroke="#10141e" stroke-width="2"/>
    <text x="60" y="140" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#737373">Impulse duration: 18ms</text>
    <text x="500" y="140" font-family="Newsreader, Georgia, serif" font-size="12" fill="#737373">Peak: -18dB (subtle tactile click)</text>
  </g>
</svg>